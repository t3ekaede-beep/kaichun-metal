name: 每日更新網站

# 每天台灣時間早上 6:17 從 Notion 抓場內車源和車款，重新產生網頁並發布。
# 改網頁（推到 main）時也會跑一次。也可以在 Actions 頁面按「Run workflow」手動跑。
on:
  schedule:
    - cron: "17 22 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 從 Notion 抓資料
        if: env.NOTION_TOKEN != ''
        continue-on-error: true
        run: python scripts/fetch_notion.py

      - name: 產生網頁
        run: python scripts/build.py

      # 把更新後的資料存回儲存庫：留下紀錄，也讓排程不會因為 60 天沒動靜被 GitHub 停掉
      - name: 資料有變就存回儲存庫
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data *.html en sitemap.xml
          if git diff --cached --quiet; then
            echo "資料沒有變"
          else
            git commit -m "每日資料更新 $(TZ=Asia/Taipei date +%F)"
            git push
          fi

      - name: 整理要發布的檔案
        run: |
          mkdir -p _site
          cp -r *.html en assets data og.png favicon.svg favicon-32.png apple-touch-icon.png robots.txt sitemap.xml .nojekyll _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
